name: CI

on:
  push:
  pull_request:

jobs:
  test-build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Ruff check when configured
        run: |
          if grep -E '^ruff([<=> ]|$)' requirements*.txt >/dev/null 2>&1; then
            python -m ruff check .
          else
            echo "ruff is not configured in dependencies; skipping"
          fi

      - name: Pytest with coverage gate
        run: python -m pytest --cov --cov-fail-under=50 -v

      - name: Compile all Python files
        run: python -m compileall .

      - name: Smoke import bot
        env:
          BOT_TOKEN: "123456:ci-smoke-token"
          ADMIN_IDS: "1"
          BOT_MODE: polling
          REQUIRE_REDIS_FSM: "false"
        run: python -c "import bot; print('bot import ok')"

      - name: Docker build
        run: docker build -t nailshop-bot:ci .

      - name: Build zip artifact
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('.')
          out = Path('nailshop_deploy_ci.zip')
          excluded_dirs = {'.git', '.venv', 'venv', '__pycache__', '.pytest_cache', '.mypy_cache', '.ruff_cache', 'backups', 'data'}
          excluded_names = {'.env', out.name}
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zf:
              for path in root.rglob('*'):
                  if path.is_dir():
                      continue
                  parts = set(path.parts)
                  if parts & excluded_dirs:
                      continue
                  if path.name in excluded_names:
                      continue
                  if path.suffix in {'.db', '.sqlite', '.sqlite3'}:
                      continue
                  zf.write(path, path.as_posix())
          print(out)
          PY

      - name: Upload zip artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nailshop-deploy-ci
          path: nailshop_deploy_ci.zip
